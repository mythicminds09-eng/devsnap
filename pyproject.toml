[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devsnap-cli"
version = "0.1.0"
description = "A lightweight, local-first project inspector for developers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DevSnap contributors" }]
dependencies = ["typer>=0.12,<1", "rich>=13.7,<15"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
devsnap = "devsnap.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
